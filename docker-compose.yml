version: "3.9"

services:
  frontend:
    build:
      context: ./rag-frontend
      dockerfile: Dockerfile
    container_name: ai_rag_frontend
    ports:
      - "3001:3000"
    environment:
      VITE_BACKEND_TARGET: http://192.168.1.65:9000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_rag_network

  backend:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    container_name: ai_rag_backend
    ports:
      - "8001:9000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: rag_ai

      QDRANT_URL: http://qdrant:6333

      # Local Windows Ollama
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: mistral:7b-instruct

      UPLOAD_DIR: /app/uploads

    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      - backend-uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/ping').read()"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

    networks:
      - ai_rag_network

  mysql:
    image: mysql:8.0
    container_name: ai_rag_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rag_ai

    ports:
      - "3308:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - ai_rag_network

  qdrant:
    image: qdrant/qdrant:v1.13.5
    container_name: ai_rag_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant-data:/qdrant/storage

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - ai_rag_network

volumes:
  mysql-data:
  qdrant-data:
  backend-uploads:

networks:
  ai_rag_network:
    driver: bridge