<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@700&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        var root = document.documentElement
        var mode = localStorage.getItem('colorMode') || 'light'
        root.classList.remove('dark', 'dark-mode', 'auto')
        if (mode === 'dark') { root.classList.add('dark', 'dark-mode'); root.style.background = '#171717' }
        else if (mode === 'auto') {
          root.classList.add('auto')
          root.style.background = window.matchMedia('(prefers-color-scheme:dark)').matches ? '#171717' : '#f3f4f6'
        } else { root.style.background = '#f3f4f6' }
        var fsMap = { small: '13px', medium: '14px', large: '16px' }
        var fs = fsMap[localStorage.getItem('fontSize')] || '14px'
        root.style.setProperty('--font-size', fs)
        root.style.fontSize = fs
        var accent = localStorage.getItem('accentColor')
        if (accent) root.style.setProperty('--accent', accent)
      } catch (e) { }
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
